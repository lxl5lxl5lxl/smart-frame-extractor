server:
  port: 8080

# 日志配置
logging:
  level:
    root: info
    com.lxl.smartframeextractor: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

extractor:
  algoUrl: "http://localhost:8080/api/frames"
  
  # 每路视频每秒最多进行几次“变化检测”
  # 不是推送给算法的帧率，只是检测频率
  # 建议 3~5，越大 CPU 压力越高
  maxCheckFps: 2

  # 两次推送图片给算法的最小间隔（毫秒）
  # 防止画面变化时疯狂推帧压垮算法
  minPushIntervalMs: 500

  # 用于“静态画面剔除”的缩略图尺寸
  # 越小越省 CPU，但对小目标不敏感
  # 推荐 320x180 或 416x234
  detectWidth: 320
  detectHeight: 180

  # 帧间“平均差异”阈值
  # 越小 → 越容易判定为“有变化”（更怕漏，误触发多）
  # 建议 2.0 ~ 4.0
  madThreshold: 2.5

  # 变化区域占整帧比例阈值（0~1）
  # 比如 0.003 = 0.3% 区域发生变化即认为有事件
  # 越小 → 对微小变化越敏感
  motionAreaRatioThreshold: 0.003

  # 长时间没有任何推送时，强制推一帧的保底周期（秒）
  # 防止完全静态时漏检关键事件（比如烟雾、火苗缓慢出现，或消防通道占用长时间不推送等问题）
  keepAlivePushIntervalSec: 20

  # 推送给算法服务的 JPEG 图片质量（0~100）
  # 建议 70~85
  jpegQuality: 100

  # RTSP 建立连接超时时间（毫秒）
  rtspOpenTimeoutMs: 5000

  # RTSP 读取数据超时时间（毫秒）
  rtspReadTimeoutMs: 5000

  # 断流后重连等待时间（毫秒）
  reconnectBackoffMs: 2000

  # 抽帧 worker 线程池大小
  # 600 路建议 >= CPU 核心数 * 2
  workerThreads: 64